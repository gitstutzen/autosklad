[tool.poetry]
name = "stutzen-integration"
version = "0.1.0"
description = "Единственная точка интеграции с api1c и TradeSoft REST API v1"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115"
uvicorn = { extras = ["standard"], version = "^0.30" }
sqlalchemy = "^2.0"
psycopg2-binary = "^2.9"
alembic = "^1.13"
pydantic = "^2.8"
httpx = "^0.27"
arq = "^0.26"
pyjwt = "^2.9"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.24"
