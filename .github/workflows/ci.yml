name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            auth: ['services/auth/**', 'libs/**']
            warehouse: ['services/warehouse/**', 'libs/**']
            marking: ['services/marking/**', 'libs/**']
            print: ['services/print/**', 'libs/**']
            stutzen-integration: ['services/stutzen-integration/**', 'libs/**']
            gateway: ['services/gateway/**', 'libs/**']

  test:
    needs: detect-changes
    if: needs.detect-changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install poetry
      - run: cd services/${{ matrix.service }} && poetry install
      - run: cd services/${{ matrix.service }} && poetry run pytest
